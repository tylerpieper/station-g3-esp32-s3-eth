[Station_G3_Waveshare_ETH]
extends = esp32_base
board = station-g3-esp32
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/station_g3_waveshare_eth
  -I src/helpers/ui
  -D STATION_G3_WAVESHARE_ETH
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=17
  -D P_LORA_NSS=2
  -D P_LORA_RESET=39
  -D P_LORA_BUSY=18
  -D P_LORA_SCLK=3
  -D P_LORA_MISO=1
  -D P_LORA_MOSI=15
  -D P_PA1_EN=42 ; PA PL1 Mode: LOW/open selects low level, HIGH/short selects high level.
  -D P_PA1_EN_ACTIVE=HIGH
  -D P_PRIMARY_LNA_EN=16 ; Primary Slot LNA Mode: LOW/open is LNA on, HIGH/short is LNA off.
  -D P_PRIMARY_LNA_EN_ACTIVE=LOW
  -D LORA_TX_POWER=7 ; SX1262 input power to the Station G3 PA; final output depends on PA PL1/PL2 level.
  -D MAX_LORA_TX_POWER=19 ; Max input drive to stay within PA / ISM limits.
  -D PIN_BOARD_SDA=40
  -D PIN_BOARD_SCL=41
  -D PIN_USER_BTN=0
  -D PIN_GPS_TX=47 ; GPS TX -> MCU RX (J2 Pin 5 <- J1 Pin 10)
  -D PIN_GPS_RX=48 ; GPS RX <- MCU TX (J2 Pin 4 <- J1 Pin 8)
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=0
  -D DISPLAY_CLASS=SH1106Display
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
  -D ARDUINO_USB_MODE=0
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/station_g3_waveshare_eth>
  +<helpers/sensors>
  +<helpers/ui/SH1106Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SH110X @ ~2.1.13
  adafruit/Adafruit GFX Library @ ^1.12.1

[env:Station_G3_Waveshare_ETH_repeater]
extends = Station_G3_Waveshare_ETH
build_flags =
  ${Station_G3_Waveshare_ETH.build_flags}
  -D ADVERT_NAME='"Station G3 Waveshare Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Station_G3_Waveshare_ETH.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${Station_G3_Waveshare_ETH.lib_deps}
  ${esp32_ota.lib_deps}

[env:Station_G3_Waveshare_ETH_room_server]
extends = Station_G3_Waveshare_ETH
build_src_filter = ${Station_G3_Waveshare_ETH.build_src_filter}
  +<../examples/simple_room_server>
build_flags =
  ${Station_G3_Waveshare_ETH.build_flags}
  -D ADVERT_NAME='"Station G3 Waveshare Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
lib_deps =
  ${Station_G3_Waveshare_ETH.lib_deps}
  ${esp32_ota.lib_deps}

[env:Station_G3_Waveshare_ETH_companion_radio_usb]
extends = Station_G3_Waveshare_ETH
build_flags =
  ${Station_G3_Waveshare_ETH.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
build_src_filter = ${Station_G3_Waveshare_ETH.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Station_G3_Waveshare_ETH.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Station_G3_Waveshare_ETH_companion_radio_ble]
extends = Station_G3_Waveshare_ETH
build_flags =
  ${Station_G3_Waveshare_ETH.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${Station_G3_Waveshare_ETH.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Station_G3_Waveshare_ETH.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Station_G3_Waveshare_ETH_companion_radio_wifi]
extends = Station_G3_Waveshare_ETH
build_flags =
  ${Station_G3_Waveshare_ETH.build_flags}
  -I examples/companion_radio/ui-new
  -D ENABLE_WIFI_INTERFACE
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${Station_G3_Waveshare_ETH.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Station_G3_Waveshare_ETH.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Station_G3_Waveshare_ETH_kiss_modem]
extends = Station_G3_Waveshare_ETH
build_src_filter = ${Station_G3_Waveshare_ETH.build_src_filter}
  +<../examples/kiss_modem/>
