# ============================================================================
# Station G3 (Waveshare ESP32-S3-ETH) Custom Builds Configuration
# ============================================================================
# Single source of truth for tracking upstream Meshtastic releases,
# board variant configuration, and optional custom patch/PR profiles.
# ============================================================================

# ============================================================================
# 1. UPSTREAM TARGETING & RETENTION POLICY
# ============================================================================
release_channels:
  track_alpha: true
  track_beta: true
  # Explicit tags to always build/keep regardless of alpha/beta status (optional)
  pinned_tags: []

retention:
  # Retain the latest N releases per channel in ./builds/
  keep_latest_alpha: 1
  keep_latest_beta: 1

# ============================================================================
# 2. BOARD VARIANTS
# ============================================================================
variants:
  custom:
    # Station G3 Baseboard with Waveshare ESP32-S3-ETH Interposer
    - name: "station-g3-waveshare-eth"
      variant_dir: "esp32s3/station-g3-waveshare-eth"
      pio_env: "station-g3-waveshare-eth"
      build_vanilla: true
      min_version: "2.8.0"
      local_patches:
        - "station-g3-eth-ota.patch"

  upstream: []

# ============================================================================
# 3. CUSTOM BUILD PROFILES (Optional PRs, Patches & Feature Modules)
# ============================================================================
custom_profiles:
  - profile_name: "pr-10531 - Multi MQTT"
    enabled: false
    min_version: "2.8.0"
    summary: "Allow MQTT uplinks to uplink multiple copies of packets"
    description: "Upstream PR #10531: Allow MQTT uplinks to uplink multiple copies of packets for analytics"
    upstream_prs:
      - 10531
    local_patches: []
    target_variants:
      - "station-g3-waveshare-eth"

  - profile_name: "dm-relay"
    enabled: false
    min_version: "2.8.0"
    summary: "DM Relay: Rebroadcasts DMs from favorited nodes as 2-hop mesh broadcasts"
    description: |
      Custom DMRelayModule:
      Listens for incoming direct messages (DMs) from favorited nodes (`nodeDB->isFavorite(from)`).
      When received, rebroadcasts the message payload to the primary channel (channel 0) as a 2-hop broadcast.
    upstream_prs: []
    local_patches:
      - "dm-relay.patch"
    build_flags: "-D ENABLE_DM_RELAY=1 -D DM_RELAY_HOP_LIMIT=2 -D DM_RELAY_CHANNEL=0"
    target_variants:
      - "station-g3-waveshare-eth"
